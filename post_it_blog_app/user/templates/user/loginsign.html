{% extends "post_it/base.html" %}
{% load static %}

{% block title %}Login & Sign In{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'user/css/loginsign.css' %}">
{% endblock %}

{# No shared navbar on the login/register page #}
{% block navbar %}{% endblock %}

{% block content %}
<main class="relative w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[620px] my-auto">

    <section class="w-full md:w-[42%] md:min-h-full relative flex items-center justify-center p-8"
        style="background-image: url('https://i.pinimg.com/1200x/c2/92/be/c292be20d4d016f9c2c8e713959ff993.jpg');background-size: 470px;">
        <div class="absolute inset-0 pointer-events-none md:hidden"></div>
    </section>

    <div class="absolute left-[35%] top-1/2 -translate-y-1/2 -translate-x-1/2 hidden md:flex flex-col z-15">
        <button id="tab-login" onclick="switchMode('login')" class="tab-clip flex items-center justify-start pl-8 pr-12 py-6 w-44 rounded-l-xl text-3xl tracking-wide shadow-md transition-all duration-300 transform hover:translate-x-2 bg-white text-[#4C9601]">
            LOGIN
        </button>
        <button id="tab-signin" onclick="switchMode('signin')" class="tab-clip flex items-center justify-start pl-8 pr-12 py-6 w-44 rounded-l-xl text-3xl tracking-wide shadow-md transition-all duration-300 transform hover:translate-x-2 bg-[#EB2E2E] text-white border-red-500">
            SIGN IN
        </button>
    </div>

    <section class="w-full md:w-[58%] brand-red text-white p-8 md:p-12 lg:p-16 flex flex-col justify-between relative min-h-[500px]">
        <div class="flex md:hidden bg-black/10 p-1.5 rounded-xl mb-8"></div>

        <div class="form-content">
            <div class="text-center mt-[-20px]">
                <img src="https://github.com/tAssylai/Project/blob/main/Group%204.png?raw=true" alt="App Logo" class="logo-img">
            </div>

            <form id="auth-form" method="POST" class="flex-1 flex flex-col justify-center max-w-md mx-auto md:mr-0 md:ml-auto w-full custom-scroll overflow-y-auto max-h-[400px] pr-2">
                {% csrf_token %}

                <input type="hidden" id="form-action" name="action" value="register">

                <!-- SIGN UP -->
                <div id="signin-fields" class="space-y-8 transition-all duration-300 mt-[50px]">

                    <div class="relative input-container">
                        <input type="text"
                            id="reg-username"
                            name="username"
                            placeholder=" "
                            class="w-full py-2 text-sm interactive-input text-white">
                        <label for="reg-username"
                            class="absolute left-0 top-2 text-lg text-white/70 uppercase tracking-wider">
                            Username
                        </label>
                    </div>

                    <div class="relative input-container">
                        <input type="email"
                            id="reg-email"
                            name="email"
                            placeholder=" "
                            class="w-full py-2 text-sm interactive-input text-white">
                        <label for="reg-email"
                            class="absolute left-0 top-2 text-lg text-white/70 uppercase tracking-wider">
                            Email
                        </label>
                    </div>

                    <div class="relative input-container">
                        <input type="password"
                            id="reg-password"
                            name="password1"
                            placeholder=" "
                            class="w-full py-2 text-sm interactive-input text-white">
                        <label for="reg-password"
                            class="absolute left-0 top-2 text-lg text-white/70 uppercase tracking-wider">
                            Password
                        </label>
                    </div>

                    <div class="relative input-container">
                        <input type="password"
                            id="reg-repeat-password"
                            name="password2"
                            placeholder=" "
                            class="w-full py-2 text-sm interactive-input text-white">
                        <label for="reg-repeat-password"
                            class="absolute left-0 top-2 text-lg text-white/70 uppercase tracking-wider">
                            Confirm Password
                        </label>
                    </div>

                </div>

                <!-- LOGIN -->
                <div id="login-fields" class="hidden space-y-8 transition-all duration-300 mt-[70px]">

                    <div class="relative input-container">
                        <input type="text"
                            id="login-identifier"
                            name="username"
                            placeholder=" "
                            class="w-full py-2 text-sm interactive-input text-white">
                        <label for="login-identifier"
                            class="absolute left-0 top-2 text-lg text-white/70 uppercase tracking-wider">
                            Username
                        </label>
                    </div>

                    <div class="relative input-container">
                        <input type="password"
                            id="login-password"
                            name="password"
                            placeholder=" "
                            class="w-full py-2 text-sm interactive-input text-white">
                        <label for="login-password"
                            class="absolute left-0 top-2 text-lg text-white/70 uppercase tracking-wider">
                            Password
                        </label>
                    </div>

                </div>

                <div class="mt-8 flex justify-end">
                    <button type="submit"
                            id="submit-btn"
                            class="px-8 py-2 rounded-full bg-white text-brand-red text-3xl
                                hover:bg-neutral-100 transform active:scale-95 transition-all
                                shadow-md hover:shadow-xl tracking-wide">
                        Sign Up
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>
{% endblock %}

{% block scripts %}
<script>
    let currentMode = 'signin';

    window.onload = () => {
        switchMode('signin');
    }

    function switchMode(mode) {
        currentMode = mode;

        const signinFields = document.getElementById('signin-fields');
        const loginFields = document.getElementById('login-fields');
        const submitBtn = document.getElementById('submit-btn');
        const formAction = document.getElementById('form-action');

        if (mode === 'signin') {
            signinFields.classList.remove('hidden');
            loginFields.classList.add('hidden');

            formAction.value = 'register';
            submitBtn.innerText = 'Sign Up';

            toggleRequiredFields(true);

            // keep your existing tab styling...
        } else {
            signinFields.classList.add('hidden');
            loginFields.classList.remove('hidden');

            formAction.value = 'login';
            submitBtn.innerText = 'Login';

            toggleRequiredFields(false);

            // keep your existing tab styling...
        }
    }

    function toggleRequiredFields(isSignIn) {
        document.getElementById('reg-username').required = isSignIn;
        document.getElementById('reg-email').required = isSignIn;
        document.getElementById('reg-password').required = isSignIn;
        document.getElementById('reg-repeat-password').required = isSignIn;

        document.getElementById('login-identifier').required = !isSignIn;
        document.getElementById('login-password').required = !isSignIn;
    }
</script>
{% endblock %}
